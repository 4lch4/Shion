services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    init: true
    restart: unless-stopped

  register-commands:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "run", "src/deploy-commands.ts"]
    env_file:
      - .env
    init: true
    profiles:
      - setup
    restart: "no"
