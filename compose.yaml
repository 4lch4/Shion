services:
  bot:
    # IMAGE_TAG is set by `deploy-app` on the server, which pins an exact
    # release (e.g. 0.2.0). The floating `0.1` default is for running by hand.
    image: 4lch4/shion-bot:${IMAGE_TAG:-0.1}
    # `build:` is for local development. On the server there is no source, and
    # Compose only reaches for the build context on an explicit `build` or
    # `--build`, so this block is inert there and `up` pulls from the registry.
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-3300}:${API_PORT:-3000}"
    init: true
    restart: unless-stopped
    healthcheck:
      # The image has no curl or wget, so Bun makes the request. /health is
      # 200 only while the Discord connection is up. `deploy-app` waits on
      # this and rolls back if it never turns healthy.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.API_PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # A Source, not part of the Gateway: it polls X and hands each new post to
  # the bot over the Compose network, like any other caller. Same image and
  # IMAGE_TAG as the bot, so a release and `deploy-app` cover both. See
  # docs/adr/0004-x-watcher.md.
  x-watcher:
    image: 4lch4/shion-bot:${IMAGE_TAG:-0.1}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "run", "src/x-watcher/index.ts"]
    # Only what the watcher needs, read from .env, rather than the bot's
    # Discord secrets too.
    environment:
      API_TOKEN: ${API_TOKEN:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_USERNAME: ${X_USERNAME:-}
      X_POLL_INTERVAL_SECONDS: ${X_POLL_INTERVAL_SECONDS:-}
      SHION_URL: http://bot:${API_PORT:-3000}
      X_STATE_FILE: /app/data/x-watcher.json
    volumes:
      - x-watcher-data:/app/data
    depends_on:
      bot:
        condition: service_healthy
    init: true
    restart: unless-stopped

  register-commands:
    image: 4lch4/shion-bot:${IMAGE_TAG:-0.1}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "run", "src/deploy-commands.ts"]
    env_file:
      - .env
    init: true
    profiles:
      - setup
    restart: "no"

volumes:
  # The newest post already delivered. Keeps a restart or redeploy from
  # re-sending old posts. `docker compose down -v` deletes it, and the next
  # start then skips everything posted in between.
  x-watcher-data:
