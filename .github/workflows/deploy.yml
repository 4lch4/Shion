name: Deploy

# Deploys one app this repository ships to AICGEN00 over the tailnet.
#
# release.yml calls this once for each published package that has an image, so
# merging the Version Packages pull request is also the deploy. Run it by hand from the
# Actions tab to redeploy a version, or to roll back by entering an older one.
# A manual run takes free text, so `app` is checked against the packages that
# declare a `docker` field in scripts/image-packages.ts.
#
# The runner joins the tailnet as an ephemeral node tagged tag:ci and logs in
# as `deploy` over Tailscale SSH, so there is no SSH key to manage. That
# user's login shell is `deploy-shell`, which accepts only "<app> <version>"
# and hands it to `deploy-app` (pull, start, wait for the healthcheck, roll
# back on failure). Both scripts live in 4lch4/Infrastructure under server/.
#
# Secrets:
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET  Tailscale OAuth client with the
#                                         auth_keys (write) scope and tag:ci
#   SHION_API_TOKEN                       optional; Shion's API_TOKEN, used to
#                                         send the deploy result as a Notification
on:
  workflow_call:
    inputs:
      app:
        description: App to deploy, as its docker.app (e.g. shion).
        type: string
        required: true
      version:
        description: Release to deploy, without the v (e.g. 0.2.0).
        type: string
        required: true

  workflow_dispatch:
    inputs:
      app:
        description: App to deploy, as its docker.app (e.g. shion).
        type: string
        required: true
      version:
        description: Release to deploy, without the v (e.g. 0.2.0). An older one rolls back.
        type: string
        required: true

permissions:
  contents: read

# One deploy at a time for the whole server, not one per app: two apps must
# never deploy at once, and a second one waits rather than canceling the
# first, which could leave the server mid-deploy.
concurrency:
  group: deploy-aicgen00
  cancel-in-progress: false

env:
  DEPLOY_HOST: aicgen00

jobs:
  deploy:
    name: Deploy to AICGEN00
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP: ${{ inputs.app }}
      # The Gateway's published port, where the deploy Notification goes. It does not
      # move when a Watcher is the app being deployed.
      SHION_PORT: "3300"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check the app and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bun run scripts/image-packages.ts --app "$APP"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.2.0, got '$VERSION'"
            exit 1
          fi

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}

      # Resolved through Tailscale itself, so this works whether or not the
      # runner picked up MagicDNS.
      - name: Find the server
        id: host
        run: |
          ip="$(sudo tailscale ip -4 "$DEPLOY_HOST")"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        env:
          HOST_IP: ${{ steps.host.outputs.ip }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          # No key: Tailscale SSH authenticates the runner by its tailnet
          # identity. The host key is new to every runner, and the WireGuard
          # tunnel has already authenticated the server, so accept it.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR \
            "deploy@$HOST_IP" "$APP $VERSION" 2>&1 | tee deploy.log

      - name: Send the result to Shion
        if: always() && steps.host.outputs.ip != ''
        env:
          HOST_IP: ${{ steps.host.outputs.ip }}
          VERSION: ${{ inputs.version }}
          OUTCOME: ${{ steps.deploy.outcome }}
          SHION_API_TOKEN: ${{ secrets.SHION_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$SHION_API_TOKEN" ]]; then
            echo "::notice::SHION_API_TOKEN is not set; skipping the deploy Notification"
            exit 0
          fi

          touch deploy.log
          if [[ "$OUTCOME" == success ]]; then
            level=info
            previous="$(sed -n 's/.*(previous: \(.*\))$/\1/p' deploy.log)"
            text="Deployed $APP $VERSION to $DEPLOY_HOST (previous: ${previous:-unknown})."
          elif rolled_back="$(sed -n 's/.*rolling back to [^:]*:\(.*\)$/\1/p' deploy.log)" &&
            [[ -n "$rolled_back" ]]; then
            level=warning
            text="Deploy of $APP $VERSION to $DEPLOY_HOST failed; rolled back to $rolled_back."
          else
            level=critical
            text="Deploy of $APP $VERSION to $DEPLOY_HOST failed ($OUTCOME)."
            text+=$'\n'"$(tail -n 15 deploy.log)"
          fi
          text+=$'\n'"$RUN_URL"

          # A rollback restarts Shion without waiting for it, so give it time
          # to reconnect to Discord before giving up. This uses the deprecated
          # /v1/messages rather than /v1/notifications on purpose: a rollback
          # can land on a version older than 0.3.0, which has only /v1/messages
          # (ADR 5).
          jq -n --arg level "$level" --arg text "${text:0:2000}" \
            '{source: "github-actions", level: $level, text: $text}' |
            curl -fsS --retry 10 --retry-all-errors --retry-delay 3 \
              -X POST "http://$HOST_IP:$SHION_PORT/v1/messages" \
              -H "Authorization: Bearer $SHION_API_TOKEN" \
              -H 'content-type: application/json' \
              --data-binary @- ||
            echo "::warning::Could not reach Shion to send the deploy Notification"
