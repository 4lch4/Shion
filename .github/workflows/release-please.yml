name: Release Please

# Maintains an open "chore(main): release X.Y.Z" PR. Merging it is the release:
# release-please bumps package.json, writes CHANGELOG.md, tags vX.Y.Z, and creates
# the GitHub Release. The tag push then triggers release.yml.
#
# The token must be a PAT (secrets.RELEASE_PLEASE_TOKEN), NOT the default
# GITHUB_TOKEN. Resources created with GITHUB_TOKEN do not trigger workflows, so
# the tag would never fire release.yml and no image would be published -- a silent
# failure. Requires a fine-grained PAT scoped to this repo with Contents and Pull
# requests set to read/write.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
