name: Release

# Publishes an image when release-please tags a release. Merging the release PR is
# what triggers this: release-please pushes the tag, the tag push lands here.
#
# Requires secrets.RELEASE_PLEASE_TOKEN (a PAT, not GITHUB_TOKEN) in the
# release-please workflow. Tags created with GITHUB_TOKEN do not trigger workflows,
# so nothing would be published and the failure would be silent.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            4lch4/shion-bot
          # latest=auto would publish `latest` on every semver tag. The floating
          # {{major}}.{{minor}} tag is what WUD watches; `latest` would make the
          # deployed version unanswerable from the registry.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
