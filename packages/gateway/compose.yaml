services:
  bot:
    # IMAGE_TAG is set by `deploy-app` on the server, which pins an exact
    # release (e.g. 0.2.0). The floating `0.1` default is for running by hand.
    image: 4lch4/shion-bot:${IMAGE_TAG:-0.1}
    # `build:` is for local development. On the server there is no source, and
    # Compose only reaches for the build context on an explicit `build` or
    # `--build`, so this block is inert there and `up` pulls from the registry.
    build:
      context: ../..
      dockerfile: packages/gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-3300}:${API_PORT:-3000}"
    init: true
    restart: unless-stopped
    # Watchers run in their own Compose projects, so they reach the Gateway
    # here, as http://shion-gateway:3000. The alias keeps another project's
    # `bot` service from answering to the same name.
    networks:
      default: {}
      shion:
        aliases:
          - shion-gateway
    healthcheck:
      # The image has no curl or wget, so Bun makes the request. /health is
      # 200 only while the Discord connection is up. `deploy-app` waits on
      # this and rolls back if it never turns healthy.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.API_PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  register-commands:
    image: 4lch4/shion-bot:${IMAGE_TAG:-0.1}
    build:
      context: ../..
      dockerfile: packages/gateway/Dockerfile
    command: ["bun", "run", "src/deploy-commands.ts"]
    env_file:
      - .env
    init: true
    profiles:
      - setup
    restart: "no"

# Created once on the server, as a provisioning step in 4lch4/Infrastructure
# (`docker network create shion`), and once locally for Compose by hand. Never
# by this file: `docker compose down` in shion would then fail while any
# Watcher was attached, and a recreated network would cut running Watchers off
# from the Gateway until they restarted.
networks:
  shion:
    external: true
